<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketa - Iniciar Sesión</title>
    <link rel="stylesheet" href="../CSS/DiseñoCuenta.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <img src="../IMAGENES/Ticketa2.png" alt="Logo" class="logo">

            <ul class="Izquierda">
                <li><a href="Index.html">Inicio</a></li>
                <li><a href="Servicios.html">Servicios</a></li>
                <li><a href="Nosotros.html">Nosotros</a></li>
            </ul>

            <ul class="Derecha">
                <li><a class="Inicio" href="IniciarS.html">Iniciar Sesión</a></li>
                <li><a class="Crear" href="Registro.html">Crear Cuenta</a></li>
            </ul>

        </nav>
    </header>

    <main class="login-container">
        <section class="login-card">
            <h1>Iniciar sesión</h1>
            <p>Accede a tu cuenta con tu usuario y contraseña.</p>

            <form id="loginForm" action="../PHP/Iniciar.php" method="POST">

                <div class="form-group">
                    <label for="User">Usuario</label>
                    <input type="text" id="User" name="User" placeholder="RJuanes123" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="********" required>
                </div>

                <button type="submit">Ingresar</button>
                <p id="loginMessage" class="login-message"></p>
            </form>
            <p class="auth-link">¿No tienes cuenta? <a href="Registro.html">Regístrate aquí</a></p>
        </section>
    </main>

    <script src="../JS/login.js"></script>
</body>

</html>
