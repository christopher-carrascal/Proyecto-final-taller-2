<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketa - Iniciar Sesión</title>
    <link rel="stylesheet" href="../CSS/DiseñoCuenta.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <img src="../IMAGENES/Imagotipo 2.png" alt="Logo" class="logo">
            <ul>
                <li><a href="Index.html">Inicio</a></li>
                <li><a href="Nosotros.html">Nosotros</a></li>
                <li><a href="Servicios.html">Servicios</a></li>
                <li><a href="Cuenta.html">Cuenta</a></li>
            </ul>
        </nav>
    </header>

    <main class="login-container">
        <section class="login-card">
            <div class="form-toggle">
                <button id="showLogin" type="button" class="active">Iniciar sesión</button>
                <button id="showRegister" type="button">Registrarse</button>
            </div>
            <h1 id="formTitle">Iniciar sesión</h1>
            <p id="formDescription">Accede a tu cuenta con tu correo y contraseña.</p>
            <form id="authForm">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@correo.com" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="********" required>

                <div id="confirmPasswordGroup" class="hidden">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="********" required>
                </div>

                <button type="submit" id="authButton">Ingresar</button>
                <p id="loginMessage" class="login-message"></p>
            </form>
        </section>
    </main>

    <script src="../JS/login.js"></script>
</body>
</html>
