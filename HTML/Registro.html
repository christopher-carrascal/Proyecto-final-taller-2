<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketa - Registrarse</title>
    <link rel="stylesheet" href="../CSS/DiseñoCuenta.css">
</head>

<body>
    <header>
    <nav class="navbar">
        <img src="../IMAGENES/Imagotipo 2.png" alt="Logo" class="logo">

        <ul class="Izquierda">
            <li><a href="Index.html">Inicio</a></li>
            <li><a href="Nosotros.html">Nosotros</a></li>
            <li><a href="Servicios.html">Servicios</a></li>
        </ul>

        <ul class="Derecha">
            <li><a class="Inicio" href="IniciarS.html">Iniciar Sesión</a></li>
            <li><a class="Crear" href="Registro.html">Crear Cuenta</a></li>  
        </ul>

    </nav>
</header>

    <main class="login-container">
        <section class="login-card">
            <h1>Registrarse</h1>
            <p>Crea una nueva cuenta guardando tus datos en tu navegador.</p>
            <form id="registerForm">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@correo.com" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="********" required>

                <label for="confirmPassword">Confirmar contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="********" required>

                <button type="submit">Registrarse</button>
                <p id="registerMessage" class="login-message"></p>
            </form>
            <p class="auth-link">¿Ya tienes cuenta? <a href="IniciarS.html">Inicia sesión aquí</a></p>
        </section>
    </main>

    <script src="../JS/registro.js"></script>
</body>
</html>
